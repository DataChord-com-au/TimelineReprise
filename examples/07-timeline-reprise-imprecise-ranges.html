<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SIMILE Timeline Reprise: Imprecise Ranges</title>

  <script src="../vendor/SIMILE/timeline-2.3.1/timeline_ajax/simile-ajax-api.js?bundle=true"></script>
  <script src="../vendor/SIMILE/timeline-2.3.1/timeline_js/timeline-api.js?bundle=true"></script>
  <link rel="stylesheet" href="../dist/timeline-reprise.css">
  <script src="../dist/timeline-reprise.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 24px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #202124;
        color: #e8eaed;
      }
    }
  </style>
</head>
<body>
  <h1>SIMILE Timeline Reprise: Imprecise Ranges</h1>
  <p>
    This example shows precise and imprecise ranges, including open, present,
    unresolved, and dynamically dated boundaries.
  </p>

  <section style="margin-top: 28px;">
    <h2>Horizontal Timeline</h2>
    <div id="timeline-horizontal" style="height: 420px;"></div>
  </section>

  <section style="margin-top: 28px;">
    <h2>Vertical Timeline</h2>
    <div id="timeline-vertical" style="width: 800px; max-width: 100%; height: 560px;"></div>
  </section>

  <script>
    var today = new Date();
    var dynamicStart = new Date(today);
    var dynamicEnd = new Date(today);
    dynamicStart.setDate(dynamicStart.getDate() - 22);
    dynamicEnd.setDate(dynamicEnd.getDate() + 4);

    function isoDate(date) {
      return date.toISOString().slice(0, 10);
    }

    var events = [
      {
        start: "2026-01-01",
        end: "2026-03-01",
        title: "Standard bounded",
        description: "Bounded both ends, no sentinels."
      },
      {
        start: "2026-03-01",
        latestStart: "2026-04-01",
        earliestEnd: "2026-07-01",
        end: "2026-07-14",
        title: "Imprecise example - both ends",
        description: "Imprecision both ends, no sentinels."
      },
      {
        start: "2026-03-01",
        latestStart: "2026-04-01",
        end: "2026-08-01",
        title: "Imprecise example - start",
        description: "Imprecision at start, no sentinels."
      },
      {
        start: "2026-04-01",
        earliestEnd: "2026-05-01",
        end: "2026-05-15",
        title: "Imprecise example - end",
        description: "Imprecision at end, no sentinels."
      },
      {
        start: "2000-01-01",
        end: "2026-07-01",
        title: "Open start example",
        description: "Sentinel start resolved before the timeline's visible range."
      },
      {
        start: isoDate(today),
        end: "2026-08-01",
        title: "Present start example",
        description: "Sentinel start resolved to today."
      },
      {
        start: "2025-06-01",
        end: "2026-08-10",
        title: "Unresolved start example",
        description: "Sentinel start resolved to a distinct, deeply uncertain date."
      },
      {
        start: "2026-04-01",
        end: "2050-01-01",
        title: "Open end example",
        description: "Sentinel end resolved after the timeline's visible range."
      },
      {
        start: "2026-05-01",
        end: isoDate(today),
        title: "Present end example",
        description: "Sentinel end resolved to today."
      },
      {
        start: "2026-06-01",
        end: "2027-12-01",
        title: "Unresolved end example",
        description: "Sentinel end resolved to a distinct, deeply uncertain date."
      },
      {
        start: isoDate(dynamicStart),
        end: isoDate(dynamicEnd),
        title: "Dynamic bounded range spanning today",
        description: "Bounded both ends, dynamically generated to span today."
      }
    ];

    Timeline.loadEventThemes([
      {
        id: "main",
        track: {
          horizontal: {
            offset: 12
          },
          vertical: {
            offset: 12
          }
        },
        range: {
          width: 4,
          iconColor: "blue",
          horizontal: {
            tapeGap: 5
          },
          vertical: {
            tapeGap: 5
          }
        }
      }
    ]);

    var clampRange = {
      start: new Date("2024-01-01T00:00:00Z"),
      end: new Date("2028-01-01T00:00:00Z")
    };

    var horizontalBandSet = Timeline.createBandSet({
      orientation: "horizontal",
      initialDate: today,
      clampRange: clampRange,

      bands: [
        {
          id: "main",
          width: "100%",
          intervalUnit: "month",
          intervalPixels: 90,
          eventTheme: "main"
        }
      ]
    });

    Timeline.attachEvents(horizontalBandSet.byId.main, events);
    Timeline.createTimeline(document.getElementById("timeline-horizontal"), horizontalBandSet);

    var verticalBandSet = Timeline.createBandSet({
      orientation: "vertical",
      initialDate: today,
      clampRange: clampRange,

      bands: [
        {
          id: "main",
          width: "100%",
          intervalUnit: "month",
          intervalPixels: 90,
          eventTheme: "main"
        }
      ]
    });

    Timeline.attachEvents(verticalBandSet.byId.main, events);
    Timeline.createTimeline(document.getElementById("timeline-vertical"), verticalBandSet);
  </script>
</body>
</html>
