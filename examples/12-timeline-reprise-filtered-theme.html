<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SIMILE Timeline Reprise: Filtered Theme Data</title>

  <script src="../vendor/SIMILE/timeline-2.3.1/timeline_ajax/simile-ajax-api.js?bundle=true"></script>
  <script src="../vendor/SIMILE/timeline-2.3.1/timeline_js/timeline-api.js?bundle=true"></script>
  <link rel="stylesheet" href="../dist/timeline-reprise.css">
  <script src="../dist/timeline-reprise.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 24px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #202124;
        color: #e8eaed;
      }
    }
  </style>
</head>
<body>
  <h1>SIMILE Timeline Reprise: Filtered Theme Data</h1>
  <p>
    This example loads visual theme configuration from JSON, filters a larger
    event set by tags, then renders the filtered result.
  </p>

  <p id="summary" style="margin: 12px 0 18px;"></p>
  <div id="timeline" style="height: 460px;"></div>

  <script id="timeline-config" type="application/json">
{
  "filter": {
    "tagsContain": ["showcase", "release"],
    "tagsNotContain": ["internal"],
    "tagsNotOnlyContain": ["draft", "archive"]
  },
  "bandSet": {
    "initialDate": "2020-03-15",
    "visualTheme": "delivery",
    "syncTarget": "main",
    "highlight": "overview",
    "bands": [
      {
        "id": "main",
        "width": "*",
        "intervalUnit": "month",
        "intervalPixels": 125
      },
      {
        "id": "overview",
        "width": "22%",
        "intervalUnit": "year",
        "intervalPixels": 220,
        "overview": true
      }
    ]
  },
  "emphasisStyles": [
    {
      "id": "critical",
      "labelColor": "red",
      "iconColor": "red"
    },
    {
      "id": "quiet",
      "labelColor": "gray",
      "iconColor": "gray"
    },
    {
      "id": "launch",
      "labelColor": "green",
      "iconColor": "green"
    }
  ],
  "visualThemes": [
    {
      "id": "delivery",
      "labels": true,
      "bubbles": true,
      "eventColorScope": "both",
      "track": {
        "horizontal": {
          "offset": 12
        }
      },
      "instant": {
        "width": 8,
        "tickWidth": 8,
        "iconColor": "orange"
      },
      "range": {
        "width": 5,
        "iconColor": "green",
        "short": {
          "minDisplayLength": 12
        }
      }
    }
  ],
  "events": [
    {
      "start": "2020-01-06",
      "title": "Briefing packet",
      "description": "Initial source material arrives.",
      "color": "blue",
      "tags": ["showcase", "planning"]
    },
    {
      "start": "2020-01-13",
      "end": "2020-02-05",
      "title": "Discovery interviews",
      "description": "External interviews and evidence gathering.",
      "color": "green",
      "tags": ["showcase", "research"]
    },
    {
      "start": "2020-01-18",
      "title": "Internal budget note",
      "description": "Filtered out by the internal tag.",
      "color": "gray",
      "tags": ["internal", "planning"]
    },
    {
      "start": "2020-02-03",
      "end": "2020-02-18",
      "title": "Prototype window",
      "description": "Short range routed as a compact event.",
      "color": "purple",
      "tags": ["showcase", "build"]
    },
    {
      "start": "2020-02-12",
      "title": "Architecture sign-off",
      "description": "A decision point with critical emphasis.",
      "color": "red",
      "emphasis": "critical",
      "tags": ["showcase", "decision"]
    },
    {
      "start": "2020-02-20",
      "end": "2020-03-27",
      "title": "Implementation phase",
      "description": "Main delivery range.",
      "color": "orange",
      "tags": ["showcase", "build"]
    },
    {
      "start": "2020-03-04",
      "end": "2020-03-05",
      "title": "Documentation sprint",
      "description": "Parallel work with quieter styling.",
      "color": "yellow",
      "emphasis": "quiet",
      "tags": ["showcase", "docs"]
    },
    {
      "start": "2020-03-12",
      "title": "Draft-only placeholder",
      "description": "Filtered out because it only has excluded tags.",
      "color": "gray",
      "tags": ["draft"]
    },
    {
      "start": "2020-03-19",
      "title": "Design review",
      "description": "A visible draft because it also has showcase.",
      "color": "purple",
      "tags": ["showcase", "draft"]
    },
    {
      "start": "2020-03-30",
      "end": "2020-04-17",
      "title": "Acceptance testing",
      "description": "Test cycle before release.",
      "color": "green",
      "tags": ["showcase", "test"]
    },
    {
      "start": "2020-04-08",
      "title": "Security review",
      "description": "Filtered out by the internal tag.",
      "color": "red",
      "tags": ["showcase", "internal", "risk"]
    },
    {
      "start": "2020-04-21",
      "title": "Release candidate",
      "description": "Candidate build selected.",
      "color": "blue",
      "emphasis": "launch",
      "tags": ["release", "showcase"]
    },
    {
      "start": "2020-04-27",
      "end": "2020-05-12",
      "title": "Launch rollout",
      "description": "Release rollout range with launch emphasis.",
      "color": "green",
      "emphasis": "launch",
      "tags": ["release", "showcase"]
    },
    {
      "start": "2020-05-06",
      "title": "Archive-only note",
      "description": "Filtered out because it only has archive.",
      "color": "gray",
      "tags": ["archive"]
    },
    {
      "start": "2020-05-18",
      "end": "2020-06-05",
      "title": "Post-release review",
      "description": "Review range after the launch.",
      "color": "blue",
      "tags": ["release", "review"]
    },
    {
      "start": "2020-06-15",
      "title": "Public retrospective",
      "description": "Final visible milestone.",
      "color": "orange",
      "tags": ["showcase", "review"]
    }
  ]
}
  </script>

  <script>
    var config = JSON.parse(document.getElementById("timeline-config").textContent);
    config.bandSet.emphasisSpecs = Timeline.loadEmphasisStyles(config.emphasisStyles);
    Timeline.loadVisualThemes(config.visualThemes);
    var filteredEvents = Timeline.filterEvents(config.events, config.filter);
    var bandSet = Timeline.createBandSet(config.bandSet);

    Timeline.attachEvents(
      [
        bandSet.byId.main,
        bandSet.byId.overview
      ],
      filteredEvents
    );
    Timeline.createTimeline(
      document.getElementById("timeline"),
      bandSet
    );

    document.getElementById("summary").textContent =
      "Showing " + filteredEvents.length + " of " + config.events.length +
      " events using theme `" + config.bandSet.visualTheme + "`.";
  </script>
</body>
</html>
