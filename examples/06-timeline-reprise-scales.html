<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SIMILE Timeline Reprise: Scales</title>

  <script src="../vendor/SIMILE/timeline-2.3.1/timeline_ajax/simile-ajax-api.js?bundle=true"></script>
  <script src="../vendor/SIMILE/timeline-2.3.1/timeline_js/timeline-api.js?bundle=true"></script>
  <link rel="stylesheet" href="../dist/timeline-reprise.css">
  <script src="../dist/timeline-reprise.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 24px;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background: #202124;
        color: #e8eaed;
      }
    }
  </style>
</head>
<body>
  <h1>SIMILE Timeline Reprise: Scales</h1>
  <p>
    This example shows scaling effects.
  </p>
  <ul>
    <li>the main band still places events by date</li>
    <li>the scale band labels every second month count from 15 February 2020</li>
    <li>the week around 15 July 2020 is expanded to show daily detail</li>
  </ul>
  
  <div id="timeline" style="height: 180px;"></div>

<script>
  var events = [
    {
      start: "2020-02-15T00:00Z",
      title: "Month 0"
    },
    {
      start: "2020-07-12T00:00Z",
      title: "Expanded zone starts"
    },
    {
      start: "2020-07-15T00:00Z",
      title: "Centre date"
    },
    {
      start: "2020-07-18T00:00Z",
      title: "Expanded zone ends"
    },
    {
      start: "2020-12-15T00:00Z",
      title: "Month 10"
    }
  ];

  var zones = [
    {
      id: "focus",
      start: "2020-07-12",
      end: "2020-07-18T00:01:00Z",
      magnify: 25,
      unit: "day",
      multiple: 1
    }
  ];

  var startDate = new Date("2020-02-15T00:00:00Z");
  var endDate = new Date("2020-12-15T00:00:00Z");
  var centerDate = new Date("2020-07-15T00:00:00Z");

  var monthCountSpec = {
    intervalUnit: "month",
    unitsPerCount: 1,
    countsPerMarker: 1,
    anchorValue: 0,
    range: {
        start: startDate,
        end: endDate
    }
  }

  var bandSet = Timeline.createBandSet({
    initialDate: centerDate,
    syncTarget: "main",
    zones: zones,

    bands: [
      {
        id: "main",
        width: "*",
        intervalUnit: "month",
        intervalPixels: 100,
        scaledZones: "focus"
      },
      {
        id: "monthCount",
        width: "25%",
        intervalUnit: "month",
        intervalPixels: 100,
        intervalMarkers: false,
        scaledZones: "focus"
      }
    ]
  });

  Timeline.attachCardinalAxis(bandSet.byId.monthCount, monthCountSpec);

  Timeline.attachEvents(bandSet.byId.main, events);
  Timeline.createTimeline(document.getElementById("timeline"), bandSet);
</script>
</body>
</html>
